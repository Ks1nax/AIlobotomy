name: 🐛 Bug report
description: Something broke (and not in the fun way)
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Model
      description: Hugging Face id or local path
      placeholder: Qwen/Qwen2.5-0.5B-Instruct
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: RTX 3060 12GB / CPU / M2
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, the operations in your medical chart (or the exported recipe) and what you expected.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log from the console window
      render: text
